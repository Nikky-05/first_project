<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f7fa;
        }
        
        .container-border {
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            padding: 30px;
            background-color: #ffffff;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 40px;
        }

        h1 {
            font-size: 2rem;
            color: #333;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card-body {
            padding: 20px;
        }

        .card-header {
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            font-size: 1.25rem;
        }

        .text-success {
            color: #28a745 !important;
        }

        .text-danger {
            color: #dc3545 !important;
        }

        .text-primary {
            color: #007bff !important;
        }

        .fw-bold {
            font-weight: 600;
            font-size: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #888;
        }

        .row > .col-md-4 {
            padding: 15px;
        }

        canvas {
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container container-border">
        <h1 class="mb-4">Transaction Dashboard</h1>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-header">Success Transactions</div>
                    <div class="card-body">
                        <h2 id="successRate" class="text-success">--%</h2>
                        <div class="fw-bold" id="successCount">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-header">Failed Transactions</div>
                    <div class="card-body">
                        <h2 id="failureRate" class="text-danger">--%</h2>
                        <div class="fw-bold" id="failureCount">--</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-header">Total Transactions</div>
                    <div class="card-body">
                        <h2 id="totalTransactions" class="text-primary">--</h2>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="mb-3">Hourly Transaction Graph</h2>
        <canvas id="transactionChart" height="100"></canvas>
    </div>

    <script>
        function formatNumber(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return n.toString();
        }

        var ctx = document.getElementById('transactionChart').getContext('2d');
        var transactionChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Successful Transactions',
                        data: [],
                        backgroundColor: 'rgba(40, 167, 69, 0.6)',
                    },
                    {
                        label: 'Failed Transactions',
                        data: [],
                        backgroundColor: 'rgba(220, 53, 69, 0.6)',
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: true },
                    y: { stacked: true, beginAtZero: true }
                },
                plugins: {
                    legend: { position: 'top' },
                    tooltip: { mode: 'index', intersect: false }
                }
            }
        });

        function updateChartData() {
            fetch('/get_transaction_data')
                .then(response => response.json())
                .then(data => {
                    let hours = [], successful = [], failed = [];
                    let successSum = 0, failSum = 0;

                    data.forEach(row => {
                        const hour = Number(row[0]);
                        const total = Number(row[1]);
                        const fail = Number(row[2]);
                        const success = Number(row[3]);

                        hours.push(hour);
                        successful.push(success);
                        failed.push(fail);
                        successSum += success;
                        failSum += fail;
                    });

                    const total = successSum + failSum;
                    const successRate = total > 0 ? ((successSum / total) * 100).toFixed(2) : '0.00';
                    const failureRate = total > 0 ? ((failSum / total) * 100).toFixed(2) : '0.00';

                    document.getElementById("successRate").innerText = successRate + '%';
                    document.getElementById("failureRate").innerText = failureRate + '%';
                    document.getElementById("totalTransactions").innerText = formatNumber(total);
                    document.getElementById("successCount").innerText = formatNumber(successSum);
                    document.getElementById("failureCount").innerText = formatNumber(failSum);

                    transactionChart.data.labels = hours;
                    transactionChart.data.datasets[0].data = successful;
                    transactionChart.data.datasets[1].data = failed;
                    transactionChart.update();
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        updateChartData();  // Initial call
        setInterval(updateChartData, 60000);  // Update every minute
    </script>

    <div class="footer">
        <p>&copy; 2025 Transaction Dashboard. All rights reserved.</p>
    </div>
</body>
</html>
